services:
  backend:
    build:
      target: development
    environment:
      DEBUG: "True"
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend/app:/app

  frontend:
    build:
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
