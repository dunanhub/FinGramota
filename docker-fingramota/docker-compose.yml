name: fingramota

services:
  postgres:
    build:
      context: ./build/postgres
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fingramota}
      POSTGRES_USER: ${POSTGRES_USER:-fingramota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fingramota-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - database

  backend:
    build:
      context: ..
      dockerfile: docker-fingramota/build/fingramota-backend/dockerfile
      target: production
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DEBUG: ${DJANGO_DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fingramota}:${POSTGRES_PASSWORD:-fingramota-dev-password}@postgres:5432/${POSTGRES_DB:-fingramota}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      DATA_EGOV_BASE_URL: ${DATA_EGOV_BASE_URL:-https://data.egov.kz}
      DATA_EGOV_API_KEY: ${DATA_EGOV_API_KEY:-}
      DATA_EGOV_TIMEOUT: ${DATA_EGOV_TIMEOUT:-10}
      DATA_EGOV_RATE_LIMIT: ${DATA_EGOV_RATE_LIMIT:-35}
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8000/api/health/
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
      - database

  frontend:
    build:
      context: ..
      dockerfile: docker-fingramota/build/fingramota-frontend/dockerfile
      target: production
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-/}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend

  pgadmin:
    build:
      context: ./build/pgadmin
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@fingramota.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-fingramota-dev-password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
  
networks:
  backend:
  frontend:
    internal: true
  database:
    internal: true

volumes:
  postgres_data:
  pgadmin_data:
